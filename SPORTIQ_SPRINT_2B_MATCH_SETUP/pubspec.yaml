name: sportiq
description: SPORTIQ - multi-sport tournament and match management app (Cricket, Football, Padel).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.2.0

  # Backend
  supabase_flutter: ^2.5.6

  # Env config
  flutter_dotenv: ^5.1.0

  # Logging
  logger: ^2.3.0

  # Utilities
  equatable: ^2.0.5
  intl: ^0.19.0
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.10

flutter:
  uses-material-design: true

  # NOTE: asset directories and custom fonts (Inter, Geist) are intentionally
  # NOT declared here because no real files exist yet under assets/ — declaring
  # them would either fail the build (missing font files) or bundle nothing
  # useful (empty folders). Re-add both sections once real files are added.
  # See TODO.md.